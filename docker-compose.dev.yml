# The doorcode server built from this checkout with Postgres and Mosquitto,
# and the services the slow connector tests need. For development: the
# passwords are fixed and the broker listens without TLS.
# docker-compose.example.yml is the starting point for a production one.
#
# The whole deployment (the app needs the key that encrypts stored secrets):
#
#   export DOORCODE_SECRET_KEY="$(openssl rand -base64 32)"   # keep it
#   docker compose -f docker-compose.dev.yml up -d --wait
#   docker compose -f docker-compose.dev.yml logs app    # the first administrator's password
#
# The app sends its mail to mailpit, whose web page at
# http://localhost:8025 (DOORCODE_MAILPIT_PORT) lists every message.
#
# Only the services the slow connector tests need:
#
#   docker compose -f docker-compose.dev.yml up -d --wait postgres mosquitto mailpit mailpit-starttls mailpit-tls
#   export DOORCODE_TEST_DATABASE_URL=postgres://doorcode:doorcode@localhost:5432/doorcode?sslmode=disable
#   export DOORCODE_TEST_BROKER_URL=mqtt://doorcode:doorcode@localhost:1883
#   export DOORCODE_TEST_MAILPIT_URL='smtp://localhost:1025?web=http://localhost:8025'
#   export DOORCODE_TEST_MAILPIT_STARTTLS_URL='smtp://localhost:1587?web=http://localhost:8026'
#   export DOORCODE_TEST_MAILPIT_TLS_URL='smtp://localhost:1465?web=http://localhost:8027'
#   make verify-integration
#
# Set DOORCODE_POSTGRES_PORT, DOORCODE_MQTT_PORT, DOORCODE_HTTP_PORT, or
# the mailpits' DOORCODE_SMTP_PORT, DOORCODE_SMTP_STARTTLS_PORT,
# DOORCODE_SMTP_TLS_PORT, DOORCODE_MAILPIT_PORT,
# DOORCODE_MAILPIT_STARTTLS_PORT, and DOORCODE_MAILPIT_TLS_PORT to publish
# on other host ports when the defaults are taken.
#
# The three mailpits catch every message and deliver none: mailpit speaks
# in the clear and offers no STARTTLS, mailpit-starttls requires STARTTLS,
# and mailpit-tls speaks TLS from the start. Both TLS ones make a
# self-signed certificate for localhost when they start and take only the
# user doorcode with the password doorcode; their web addresses list what
# each caught.
# DOORCODE_BROKER_ADMIN_USERNAME and DOORCODE_BROKER_ADMIN_PASSWORD name the
# broker's administrator, which the server connects as; they take effect
# when the broker's volume is new.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: doorcode
      POSTGRES_PASSWORD: doorcode
      POSTGRES_DB: doorcode
    ports:
      - "${DOORCODE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorcode -d doorcode"]
      interval: 2s
      timeout: 5s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/doorcode/entrypoint.sh"]
    environment:
      DOORCODE_BROKER_ADMIN_USERNAME: ${DOORCODE_BROKER_ADMIN_USERNAME:-doorcode}
      DOORCODE_BROKER_ADMIN_PASSWORD: ${DOORCODE_BROKER_ADMIN_PASSWORD:-doorcode}
    # Every door holds a connection open, and Docker's default of 1024 open
    # files makes the broker refuse new ones somewhere short of 1000 doors.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${DOORCODE_MQTT_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/entrypoint.sh:/doorcode/entrypoint.sh:ro
      - mosquitto:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u \"$$DOORCODE_BROKER_ADMIN_USERNAME\" -P \"$$DOORCODE_BROKER_ADMIN_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.29.6
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${DOORCODE_SMTP_PORT:-1025}:1025"
      - "${DOORCODE_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit-starttls:
    image: axllent/mailpit:v1.29.6
    environment:
      MP_SMTP_AUTH: "doorcode:doorcode"
      MP_SMTP_TLS_CERT: "sans:localhost"
      MP_SMTP_TLS_KEY: "sans:localhost"
      MP_SMTP_REQUIRE_STARTTLS: "true"
    ports:
      - "${DOORCODE_SMTP_STARTTLS_PORT:-1587}:1025"
      - "${DOORCODE_MAILPIT_STARTTLS_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit-tls:
    image: axllent/mailpit:v1.29.6
    environment:
      MP_SMTP_AUTH: "doorcode:doorcode"
      MP_SMTP_TLS_CERT: "sans:localhost"
      MP_SMTP_TLS_KEY: "sans:localhost"
      MP_SMTP_REQUIRE_TLS: "true"
    ports:
      - "${DOORCODE_SMTP_TLS_PORT:-1465}:1025"
      - "${DOORCODE_MAILPIT_TLS_PORT:-8027}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      target: doorcode
    environment:
      DOORCODE_DATABASE_URL: postgres://doorcode:doorcode@postgres:5432/doorcode?sslmode=disable
      DOORCODE_BROKER_URL: mqtt://${DOORCODE_BROKER_ADMIN_USERNAME:-doorcode}:${DOORCODE_BROKER_ADMIN_PASSWORD:-doorcode}@mosquitto:1883
      DOORCODE_LISTEN_ADDR: ":8080"
      # 32 random bytes in standard base64: openssl rand -base64 32. The
      # server refuses to start without it; keep it, since stored secrets
      # cannot be read under another key.
      DOORCODE_SECRET_KEY: ${DOORCODE_SECRET_KEY:-}
      # Mail goes to the mailpit, which takes it in the clear without a
      # password; the Mail tab shows these as set by the deployment.
      DOORCODE_MAIL_HOST: mailpit
      DOORCODE_MAIL_PORT: "1025"
      DOORCODE_MAIL_SECURITY: none
      DOORCODE_MAIL_FROM: doorcode dev <doorcode@example.com>
    ports:
      - "${DOORCODE_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres:
  mosquitto:
