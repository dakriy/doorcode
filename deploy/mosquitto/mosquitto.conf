# Development broker. Nothing may connect anonymously: the dynamic-security
# plugin holds every client, the server's administrator among them, and the
# server manages the rest over $CONTROL/dynamic-security/v1.
listener 1883
allow_anonymous false
persistence true
persistence_location /mosquitto/data/
log_dest stdout
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
