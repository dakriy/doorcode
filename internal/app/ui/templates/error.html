{{define "body"}}
<main class="flex min-h-full items-center justify-center px-4 py-16">
  <div class="w-full max-w-md text-center">
    <div class="mx-auto flex size-12 items-center justify-center rounded-full bg-red-100 text-red-600 dark:bg-red-950 dark:text-red-400">
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
    </div>
    <h1 class="mt-6 text-2xl font-semibold tracking-tight">Something went wrong</h1>
    <p class="mt-3 text-sm text-zinc-600 dark:text-zinc-400">The server could not finish this request. Try again in a moment. If it keeps happening, give an administrator this request id:</p>
    <p role="alert" class="mt-4 inline-block rounded-md bg-zinc-100 px-3 py-1.5 font-mono text-sm text-zinc-800 dark:bg-zinc-900 dark:text-zinc-200">{{.Content}}</p>
    <p class="mt-8"><a href="/" class="text-sm font-medium text-brand-600 hover:text-brand-500 dark:text-brand-400">Back to the home page</a></p>
  </div>
</main>
{{end}}
