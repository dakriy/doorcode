{{define "content"}}
<div class="max-w-2xl">
  <h1 class="text-2xl font-semibold tracking-tight">Access</h1>
  <p class="mt-2 text-sm text-zinc-600 dark:text-zinc-400">The doors this site shows everyone. Open a door’s calendar to see when it is unlocked for anyone and when your code works there.</p>
</div>
<section aria-label="Doors" class="mt-8 overflow-hidden {{template "card-class"}}">
  {{template "portal-doors" .Content}}
</section>
{{template "calendar-key" (calendarkey "Your" "open" "code" "locked")}}
{{end}}
