# The verification gates of AGENTS.md (Commands). The full mutation run is
# left to the batch review before merging (AGENTS.md, Deviations); a pull
# request runs the mutants on its own changed lines.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The budget times compiling the coverage builds as well as running
      # the tests, and the runner compiles them from a cold cache on four
      # cores (about 13 seconds, against about 2 locally).
      FAST_BUDGET_SECONDS: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-fast

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOORCODE_TEST_DATABASE_URL: postgres://doorcode:doorcode@localhost:5432/doorcode?sslmode=disable
      DOORCODE_TEST_BROKER_URL: mqtt://doorcode:doorcode@localhost:1883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The broker mounts its configuration from the checkout, so it starts
      # from the compose file rather than as a job service.
      - run: docker compose up -d --wait postgres mosquitto
      - run: make verify-integration
      - if: failure()
        run: docker compose logs postgres mosquitto

  mutation-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-mutation-diff BASE=origin/${{ github.base_ref }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-diff
          path: build/mutation.*
          if-no-files-found: ignore
