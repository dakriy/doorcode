# A production deployment of the published doorcode server with PostgreSQL
# and Mosquitto, behind a proxy on this host that terminates TLS. The web
# server listens on 127.0.0.1:8080 and the broker on 127.0.0.1:1883; the
# proxy serves them over TLS, the broker usually on 8883, where doors
# connect and verify its certificate against door_broker_ca_pem.
#
# In a checkout of this repository (the broker mounts deploy/mosquitto):
#
#   cp docker-compose.example.yml docker-compose.yml
#
# Put the secrets in a .env file next to it, and keep them: stored secrets
# cannot be read under another DOORCODE_SECRET_KEY, and the passwords take
# effect only when their volumes are new. The passwords go into URLs, so
# keep to URL-safe characters, as hex does.
#
#   DOORCODE_SECRET_KEY=<openssl rand -base64 32>
#   DOORCODE_POSTGRES_PASSWORD=<openssl rand -hex 24>
#   DOORCODE_BROKER_ADMIN_PASSWORD=<openssl rand -hex 24>
#
# Then:
#
#   docker compose up -d --wait
#   docker compose logs app    # the first administrator's password
#
# To upgrade within the release line the image names:
#
#   docker compose pull && docker compose up -d --wait
#
# Back up the postgres and mosquitto volumes; the README's "Deploy with
# docker compose" section covers the settings to make after the first start.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: doorcode
      POSTGRES_PASSWORD: ${DOORCODE_POSTGRES_PASSWORD:?set DOORCODE_POSTGRES_PASSWORD}
      POSTGRES_DB: doorcode
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorcode -d doorcode"]
      interval: 5s
      timeout: 5s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/doorcode/entrypoint.sh"]
    environment:
      DOORCODE_BROKER_ADMIN_USERNAME: ${DOORCODE_BROKER_ADMIN_USERNAME:-doorcode}
      DOORCODE_BROKER_ADMIN_PASSWORD: ${DOORCODE_BROKER_ADMIN_PASSWORD:?set DOORCODE_BROKER_ADMIN_PASSWORD}
    # Every door holds a connection open, and Docker's default of 1024 open
    # files makes the broker refuse new ones somewhere short of 1000 doors.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/entrypoint.sh:/doorcode/entrypoint.sh:ro
      - mosquitto:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u \"$$DOORCODE_BROKER_ADMIN_USERNAME\" -P \"$$DOORCODE_BROKER_ADMIN_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    # The server, tagged by release: 2.0 follows the 2.0 line, 2.0.0 pins
    # one release, latest follows every release.
    image: ghcr.io/dakriy/doorcode:2.0
    restart: unless-stopped
    environment:
      DOORCODE_DATABASE_URL: postgres://doorcode:${DOORCODE_POSTGRES_PASSWORD}@postgres:5432/doorcode?sslmode=disable
      DOORCODE_BROKER_URL: mqtt://${DOORCODE_BROKER_ADMIN_USERNAME:-doorcode}:${DOORCODE_BROKER_ADMIN_PASSWORD}@mosquitto:1883
      DOORCODE_SECRET_KEY: ${DOORCODE_SECRET_KEY:?set DOORCODE_SECRET_KEY}
      # The proxy reaches the server from the compose network's gateway;
      # list it so the server believes its X-Forwarded-For and
      # X-Forwarded-Proto. Any setting can be given here the same way.
      # DOORCODE_TRUSTED_PROXIES: 172.16.0.0/12
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres:
  mosquitto:
